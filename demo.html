<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI SOC Analyst — Request a demo | ASA AI</title>
<meta name="description" content="Request a personalised demo of ASA AI's AI SOC Analyst.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --magenta:#D6247A; --magenta-dark:#B81C68; --violet:#6B2FA0;
    --ink:#1A1A2E; --page:#F2F2F2; --card:#FAF8F4; --hero:#F3F1EA;
    --muted:#5B5B6E; --line:#E4E0D8; --pink-soft:#FBE9F1; --err:#B3261E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:40px auto;padding:0 16px}
  .card{background:var(--card);box-shadow:0 1px 3px rgba(26,26,46,.06)}
  .hero{background:var(--hero);padding:22px 26px 26px;border-bottom:4px solid var(--magenta)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px;height:30px}
  .brand img{height:30px;width:auto;border-radius:4px}
  .wordmark{display:none;font-weight:700;font-size:19px;color:var(--violet)}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--magenta);margin:0 0 6px}
  h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:30px;line-height:1.2;margin:0 0 10px}
  .lead{margin:0;color:var(--muted)}
  .body{padding:24px 26px 28px}
  ul.points{margin:0 0 22px;padding-left:20px}
  ul.points li{margin:4px 0}
  label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
  label .opt{font-weight:400;color:var(--muted)}
  input,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #CFCAC0;border-radius:6px;padding:10px 12px}
  textarea{min-height:96px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--violet);outline-offset:1px;border-color:var(--violet)}
  .field-err{color:var(--err);font-size:13px;margin-top:4px;min-height:1px}
  input.bad{border-color:var(--err)}
  .btn{display:block;width:100%;margin-top:22px;background:var(--magenta);color:#fff;border:0;border-radius:6px;padding:13px 16px;font:600 16px "Inter",sans-serif;cursor:pointer}
  .btn:hover{background:var(--magenta-dark)}
  .btn[disabled]{opacity:.6;cursor:wait}
  .note{font-size:12.5px;color:var(--muted);margin-top:14px}
  .msg{display:none;margin-top:18px;padding:14px 16px;border-radius:6px}
  .msg.ok{display:block;background:var(--pink-soft);border-left:4px solid var(--magenta)}
  .msg.ko{display:block;background:#FDECEA;border-left:4px solid var(--err)}
  .hp{position:absolute;left:-9999px}
  footer{text-align:center;font-size:12.5px;color:var(--muted);padding:18px 16px 40px}
  footer a{color:var(--violet)}
  @media (max-width:480px){h1{font-size:25px}.hero,.body{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div class="hero">
      <div class="brand">
        <img src="ASA-AI-LOGO.png" alt="ASA AI" onerror="this.style.display='none';document.querySelector('.wordmark').style.display='block'">
        <span class="wordmark">ASA AI</span>
      </div>
      <p class="kicker" data-i18n="kicker"></p>
      <h1 data-i18n="title"></h1>
      <p class="lead" data-i18n="lead"></p>
    </div>
    <div class="body">
      <ul class="points">
        <li data-i18n="p1"></li>
        <li data-i18n="p2"></li>
        <li data-i18n="p3"></li>
      </ul>

      <form id="demo-form" action="https://formsubmit.co/contact@asa-ai.fr" method="POST" novalidate>
        <input type="hidden" name="_subject" id="f-subject">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" id="next-url">
        <input type="hidden" name="Langue" id="f-lang">
        <label for="f-email"><span data-i18n="lEmail"></span></label>
        <input id="f-email" name="email" type="email" autocomplete="email" required>
        <div class="field-err" id="e-email"></div>

        <label for="f-tel"><span data-i18n="lTel"></span></label>
        <input id="f-tel" name="Téléphone" type="tel" autocomplete="tel" placeholder="+33 6 12 34 56 78" required>
        <div class="field-err" id="e-tel"></div>

        <label for="f-com"><span data-i18n="lCom"></span> <span class="opt" data-i18n="opt"></span></label>
        <textarea id="f-com" name="Commentaire" maxlength="2000"></textarea>

        <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off">

        <button class="btn" type="submit" id="f-btn" data-i18n="btn"></button>
        <p class="note" data-i18n="rgpd"></p>
        <div class="msg" id="f-msg" role="status"></div>
      </form>
    </div>
  </div>
  <footer><a href="./" data-i18n="back"></a><br>© ASA AI · <a href="https://www.asa-ai.fr">www.asa-ai.fr</a> · contact@asa-ai.fr</footer>
</main>

<script>
(function(){
  var T = {
    en:{back:"← Back to the AI SOC Analyst page",kicker:"AI SOC Analyst",title:"Request a demo",
        lead:"See how our AI SOC Analyst triages alerts, enriches them and proposes a response your analysts validate.",
        p1:"A 30-minute session tailored to your SOC",p2:"Live on a real Wazuh / MISP environment",p3:"Your data stays sovereign: local models, no foreign cloud",
        lEmail:"Business email",lTel:"Phone number",lCom:"Comment",opt:"(optional)",btn:"Request my demo",
        rgpd:"Your details are only used to contact you about this demo. To be removed, write to contact@asa-ai.fr.",
        eEmail:"Please enter a valid email address.",eFree:"Please use your business email address (free or personal providers are not accepted).",
        eTel:"Please enter a valid phone number (8 to 15 digits).",
        ok:"Thank you, your request has been sent. We will contact you shortly to schedule your demo.",
        ko:"Sending failed. Please try again or write to contact@asa-ai.fr.",sending:"Sending…"},
    fr:{back:"← Retour à la page AI SOC Analyst",kicker:"AI SOC Analyst",title:"Demander une démo",
        lead:"Découvrez comment notre AI SOC Analyst trie les alertes, les enrichit et propose une réponse validée par vos analystes.",
        p1:"Une séance de 30 minutes adaptée à votre SOC",p2:"En direct sur un environnement Wazuh / MISP réel",p3:"Vos données restent souveraines : modèles locaux, aucun cloud étranger",
        lEmail:"E-mail professionnel",lTel:"Numéro de téléphone",lCom:"Commentaire",opt:"(facultatif)",btn:"Demander ma démo",
        rgpd:"Vos coordonnées servent uniquement à vous recontacter pour cette démo. Pour ne plus être contacté, écrivez à contact@asa-ai.fr.",
        eEmail:"Merci de saisir une adresse e-mail valide.",eFree:"Merci d'utiliser votre adresse e-mail professionnelle (les messageries gratuites ou personnelles ne sont pas acceptées).",
        eTel:"Merci de saisir un numéro de téléphone valide (8 à 15 chiffres).",
        ok:"Merci, votre demande a bien été envoyée. Nous vous recontactons rapidement pour fixer votre démo.",
        ko:"L'envoi a échoué. Réessayez ou écrivez à contact@asa-ai.fr.",sending:"Envoi…"},
    es:{back:"← Volver a la página AI SOC Analyst",kicker:"AI SOC Analyst",title:"Solicitar una demo",
        lead:"Descubra cómo nuestro AI SOC Analyst clasifica las alertas, las enriquece y propone una respuesta que validan sus analistas.",
        p1:"Una sesión de 30 minutos adaptada a su SOC",p2:"En directo sobre un entorno Wazuh / MISP real",p3:"Sus datos siguen siendo soberanos: modelos locales, sin nube extranjera",
        lEmail:"Correo profesional",lTel:"Número de teléfono",lCom:"Comentario",opt:"(opcional)",btn:"Solicitar mi demo",
        rgpd:"Sus datos solo se usan para contactarle sobre esta demo. Para darse de baja, escriba a contact@asa-ai.fr.",
        eEmail:"Introduzca una dirección de correo válida.",eFree:"Utilice su correo profesional (no se aceptan correos gratuitos o personales).",
        eTel:"Introduzca un número de teléfono válido (de 8 a 15 dígitos).",
        ok:"Gracias, su solicitud se ha enviado. Le contactaremos en breve para programar su demo.",
        ko:"El envío ha fallado. Inténtelo de nuevo o escriba a contact@asa-ai.fr.",sending:"Enviando…"}
  };
  var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
  var lang = nav.slice(0,2).toLowerCase();
  if (!T[lang]) lang = "en";
  var t = T[lang];
  document.documentElement.lang = lang;
  document.title = "AI SOC Analyst — " + t.title + " | ASA AI";
  document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t[el.getAttribute("data-i18n")]; });

  var FREE = ["gmail.com","googlemail.com","outlook.com","outlook.fr","hotmail.com","hotmail.fr","live.com","live.fr","msn.com",
    "yahoo.com","yahoo.fr","ymail.com","icloud.com","me.com","mac.com","aol.com","proton.me","protonmail.com","pm.me",
    "orange.fr","wanadoo.fr","free.fr","sfr.fr","neuf.fr","laposte.net","bbox.fr","gmx.com","gmx.fr","gmx.de","web.de",
    "mail.com","yandex.com","yandex.ru","zoho.com","tutanota.com","mailinator.com","yopmail.com","yopmail.fr",
    "guerrillamail.com","10minutemail.com","temp-mail.org","trashmail.com"];

  var f = document.getElementById("demo-form"), btn = document.getElementById("f-btn"), msg = document.getElementById("f-msg");
  var em = document.getElementById("f-email"), tel = document.getElementById("f-tel"), com = document.getElementById("f-com");

  function setErr(input, id, text){ document.getElementById(id).textContent = text || ""; input.classList.toggle("bad", !!text); }

  function checkEmail(){
    var v = em.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/.test(v)) { setErr(em,"e-email",t.eEmail); return false; }
    if (FREE.indexOf(v.split("@")[1]) !== -1) { setErr(em,"e-email",t.eFree); return false; }
    setErr(em,"e-email",""); return true;
  }
  function checkTel(){
    var v = tel.value.trim(), d = v.replace(/\D/g,"");
    if (!/^\+?[\d\s.\-()]+$/.test(v) || d.length < 8 || d.length > 15) { setErr(tel,"e-tel",t.eTel); return false; }
    setErr(tel,"e-tel",""); return true;
  }
  em.addEventListener("blur", checkEmail);
  tel.addEventListener("blur", checkTel);

  /* Envoi classique vers FormSubmit : la verification anti-robot (captcha) s'affiche, puis retour ici avec ?merci=1 */
  document.getElementById("next-url").value = location.origin + location.pathname + "?merci=1";
  document.getElementById("f-lang").value = lang.toUpperCase();
  if (new URLSearchParams(location.search).get("merci")) { msg.className = "msg ok"; msg.textContent = t.ok; }

  f.addEventListener("submit", function(e){
    msg.className = "msg"; msg.textContent = "";
    var a = checkEmail(), b = checkTel();
    if (!a || !b) { e.preventDefault(); (a ? tel : em).focus(); return; }
    var email = em.value.trim();
    document.getElementById("f-subject").value = "Demande de démo AI SOC Analyst — " + email + " (" + lang.toUpperCase() + ")";
    if (!com.value.trim()) com.value = "—";
    btn.disabled = true; btn.textContent = t.sending;
  });
})();
</script>
</body>
</html>
