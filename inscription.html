<style>
  :root{
    --magenta:#D6247A; --magenta-dark:#B81C68; --violet:#6B2FA0;
    --ink:#1A1A2E; --page:#F2F2F2; --card:#FAF8F4; --hero:#F3F1EA;
    --grid-bg:#2E2554; --grid-line:#6F6FC9; --node:#7B8CE6;
    --muted:#5B5B6E; --line:#E4E0D8; --pink-soft:#FBE9F1;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:40px auto;padding:0 16px}
  .card{background:var(--card);box-shadow:0 1px 3px rgba(26,26,46,.06)}

  /* ---------- Bandeau ---------- */
  .hero{display:grid;grid-template-columns:1fr 262px;background:var(--hero);min-height:250px}
  .hero-left{padding:22px 26px 24px;display:flex;flex-direction:column;justify-content:center}
  .brand{align-self:flex-start;display:flex;align-items:center;gap:12px;margin-bottom:22px;height:30px}
  .brand img{height:30px;width:auto;border-radius:4px}
  .wordmark{display:none;align-items:center;gap:6px;font-weight:700;font-size:19px;letter-spacing:-.2px;color:var(--ink)}
  .wordmark .mark{width:22px;height:22px}
  .brand .sep{width:1px;height:20px;background:#CFCAC0}
  .brand .co{font:500 10px/1.1 "JetBrains Mono",monospace;color:var(--violet);text-transform:uppercase;letter-spacing:.6px}
  .tag{align-self:flex-start;display:inline-block;background:#fff;border:1px solid var(--line);font:500 10px/1 "JetBrains Mono",monospace;letter-spacing:1.6px;text-transform:uppercase;padding:7px 10px;margin-bottom:16px;color:#3a3a4a}
  h1{font-family:"Source Serif 4",Georgia,serif;font-weight:500;font-size:28px;line-height:1.15;letter-spacing:-.3px;margin:0;color:#14142a}
  .hero-right{background:var(--grid-bg);display:flex;align-items:center;justify-content:center;padding:6px}
  .hero-right svg{width:100%;max-width:250px;height:auto;display:block}
  .hero-right text{font-family:"Inter",system-ui,sans-serif}

  /* ---------- Corps ---------- */
  .body{padding:26px 28px 8px}
  .body p{margin:0 0 14px}
  .hl{color:var(--magenta);font-style:italic;text-decoration:none}
  .hl:hover{text-decoration:underline}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:30px 0 26px}
  .fact svg{width:26px;height:26px;stroke:var(--magenta);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .fact b{display:block;font-size:13.5px;line-height:1.35;margin-top:8px}
  .fact span{display:block;font-size:13px;font-weight:600}
  .cta{display:flex;justify-content:center;margin:4px 0 30px}
  .btn{display:inline-block;background:var(--magenta);color:#fff;font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;transition:background .15s}
  .btn:hover{background:var(--magenta-dark)}
  .btn-alt{background:#fff;color:var(--magenta);border:2px solid var(--magenta);padding:11px 24px}
  .btn-alt:hover{background:var(--pink-soft);color:var(--magenta-dark)}
  .cta{gap:12px;flex-wrap:wrap}
  .sign p{margin:0 0 6px}

  /* ---------- Programme ---------- */
  .agenda{margin:22px 0 0;padding:20px 28px 22px;background:var(--pink-soft);border-top:1px solid #F3D3E2}
  .agenda h2,.reg h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:19px;margin:0 0 12px}
  .agenda ul{margin:0;padding:0;list-style:none}
  .agenda li{position:relative;padding:0 0 9px 22px;font-size:14px}
  .agenda li::before{content:"";position:absolute;left:2px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--magenta)}

  /* ---------- Inscription ---------- */
  .reg{padding:26px 28px 28px;border-top:1px solid var(--line)}
  .reg .sub{color:var(--muted);font-size:13.5px;margin:-4px 0 18px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;font-size:12.5px;font-weight:600;margin:0 0 5px}
  .f{margin-bottom:14px}
  input,select{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid #D6D1C7;border-radius:6px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid rgba(214,36,122,.25);border-color:var(--magenta)}
  .consent{font-weight:400;display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin:4px 0 18px}
  .consent input{width:auto;margin-top:3px;accent-color:var(--magenta)}
  .reg .btn{width:100%}
  .ok{display:none;background:#EEF8F1;border:1px solid #BFE3CB;color:#1E6B3A;padding:14px 16px;border-radius:6px;font-size:14px;margin-bottom:16px}
  .ok.show{display:block}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
  input:user-invalid{border-color:#C0392B}

  footer{text-align:center;font-size:12px;color:#8A8A98;padding:18px 0 40px}
  footer a{color:var(--violet);text-decoration:none}

  @media (max-width:480px){
    .wrap{margin:16px auto}
    .hero{grid-template-columns:1fr}
    h1{font-size:24px}
    .body,.reg,.agenda{padding-left:18px;padding-right:18px}
    .row{grid-template-columns:1fr;gap:0}
    .facts{gap:4px}
  }
</style>

  const INTERVALLE_JOURS = 14;
  const NB_SESSIONS_AFFICHEES = 8;
  const EXCLUSIONS = [                       /* [début, fin] inclus — source : service-public.gouv.fr */
    ["2026-10-17","2026-11-01"],             /* Toussaint 2026 */
    ["2026-12-19","2027-01-03"],             /* Noël 2026 */
    ["2027-02-06","2027-02-21"],             /* Hiver 2027 (zone C) */
    ["2027-04-03","2027-04-18"],             /* Printemps 2027 (zone C) */
    ["2027-05-06","2027-05-06"],             /* Ascension 2027 */
    ["2027-07-03","2027-08-31"],             /* Été 2027 */
    ["2026-11-11","2026-11-11"],["2026-12-25","2026-12-25"],["2027-01-01","2027-01-01"],

  const exclu = d => EXCLUSIONS.some(([a,b]) => d >= a && d <= b);
  const SESSIONS = [];
  for (let d = new Date(PREMIERE_SESSION+"T12:00:00"), n = 0; n < 60; n++, d.setDate(d.getDate()+INTERVALLE_JOURS)) {
    const s = iso(d); if (!exclu(s)) SESSIONS.push(s);
  }

      demoBtn:"Request a demo", cta:"Register now", bye:"Hope to see you there.", team:"The ASA AI team",

  /* Détection automatique de la langue du lecteur (anglais par défaut) */
  const prefs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]);
  let lang = "en";
  for (const l of prefs){ const c = (l||"").slice(0,2).toLowerCase(); if (T[c]) { lang = c; break; } }
  const qLang = new URLSearchParams(location.search).get("lang"); if (qLang && T[qLang]) lang = qLang;
  const L = T[lang];

  document.documentElement.lang = lang;
  document.title = L.pageTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = L[el.dataset.i18n]; });
  const $ = id => document.getElementById(id);
  if ($("agenda-list")) $("agenda-list").innerHTML = L.agenda.map(a => "<li>"+a+"</li>").join("");
  if ($("f-subject")) $("f-subject").value = L.subject;
  if ($("f-lang")) $("f-lang").value = lang.toUpperCase();

  /* Sessions affichées dans la langue du lecteur ; la valeur envoyée reste en français pour le suivi interne */
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = SESSIONS.filter(d => new Date(d+"T23:59:59") >= today).slice(0, NB_SESSIONS_AFFICHEES);
  const long = (d,loc) => new Date(d+"T15:00:00").toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const sel = document.getElementById("session");
  if (sel) upcoming.forEach(d => {
    const o = document.createElement("option");
    o.value = long(d,"fr-FR") + " — 15h00";
    o.textContent = long(d,L.locale) + " — " + L.at;
    sel.appendChild(o);
  });
  if (upcoming.length && $("next-date")){
    $("next-date").textContent =
      new Date(upcoming[0]+"T15:00:00").toLocaleDateString(L.locale,{day:"numeric",month:"long"});
  }

  if ($("form")) {
  /* ---------- Contrôles : e-mail professionnel + téléphone ---------- */
  const FREE_EXACT = new Set(["gmail.com","googlemail.com","ymail.com","rocketmail.com","msn.com","icloud.com","me.com","mac.com",
    "aol.com","aol.fr","mail.com","email.com","protonmail.com","protonmail.ch","proton.me","pm.me","tutanota.com","tutanota.de","tuta.io",
    "zoho.com","zohomail.com","fastmail.com","hey.com","mail.ru","bk.ru","inbox.ru","list.ru","qq.com","163.com","126.com","sina.com",
    "laposte.net","orange.fr","wanadoo.fr","free.fr","sfr.fr","neuf.fr","cegetel.net","bbox.fr","numericable.fr","noos.fr",
    "aliceadsl.fr","club-internet.fr","voila.fr","web.de","t-online.de","freenet.de","libero.it","virgilio.it","tiscali.it",
    "terra.es","telefonica.net","seznam.cz","wp.pl","o2.pl","interia.pl","rediffmail.com","mailinator.com","yopmail.com",
    "yopmail.fr","guerrillamail.com","10minutemail.com","temp-mail.org","trashmail.com"]);
  const FREE_BASE = ["gmail","yahoo","hotmail","outlook","live","gmx","yandex","msn"];
  function isProEmail(v){
    const m = /^[^@\s]+@([^@\s]+\.[a-z]{2,})$/i.exec((v||"").trim());
    if (!m) return false;
    const d = m[1].toLowerCase();
    if (FREE_EXACT.has(d)) return false;
    if (FREE_BASE.includes(d.split(".")[0])) return false;
    return true;
  }
  function isPhone(v){
    const t = (v||"").trim();
    if (!/^\+?[0-9\s().\-\/]+$/.test(t)) return false;
    const n = t.replace(/\D/g,"").length;
    return n >= 8 && n <= 15;
  }
  const emailEl = document.getElementById("email"), telEl = document.getElementById("tel");
  const checkEmail = () => emailEl.setCustomValidity(emailEl.value && !isProEmail(emailEl.value) ? L.errEmail : "");
  const checkTel   = () => telEl.setCustomValidity(telEl.value && !isPhone(telEl.value) ? L.errPhone : "");
  emailEl.addEventListener("input", checkEmail); telEl.addEventListener("input", checkTel);

  /* Avant envoi : contrôles + ligne technique pour le fichier CSV (lue par le service côté messagerie) */
  const b64 = str => { const by = new TextEncoder().encode(str); let bin=""; by.forEach(c => bin += String.fromCharCode(c)); return btoa(bin); };
  document.getElementById("form").addEventListener("submit", e => {
    checkEmail(); checkTel();
    const f = e.target;
    if (!f.checkValidity()){ e.preventDefault(); f.reportValidity(); return; }
    const rec = {
      session: sel.value, prenom: f["Prénom"].value.trim(), nom: f["Nom"].value.trim(),
      email: emailEl.value.trim().toLowerCase(), telephone: telEl.value.trim(),
      entreprise: f["Entreprise"].value.trim(), fonction: f["Fonction"].value.trim(),
      langue: lang.toUpperCase(), envoye_le: new Date().toISOString()
    };
    document.getElementById("f-ref").value = "ASAAI1:" + b64(JSON.stringify(rec));
  });

  /* Retour après envoi : même page avec ?merci=1 */
  document.getElementById("next-url").value = location.origin + location.pathname + "?merci=1&lang=" + lang;
  if (new URLSearchParams(location.search).get("merci")) document.getElementById("ok").classList.add("show");
  }
</script>
</body>
</html>
